<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#grad)" />
  <!-- Traditional Chinese decorative border inner frame -->
  <rect x="40" y="40" width="432" height="432" rx="72" fill="none" stroke="url(#gold)" stroke-width="8" stroke-opacity="0.4" stroke-dasharray="16 8" />
  <!-- Chinese Seal / Book icon motif -->
  <g filter="url(#shadow)">
    <!-- Open Book base -->
    <path d="M120 340 C 180 320, 230 330, 256 350 C 282 330, 332 320, 392 340 L 392 200 C 332 180, 282 190, 256 210 C 230 190, 180 180, 120 200 Z" fill="#ffffff" fill-opacity="0.95" />
    <!-- Book spine divider -->
    <line x1="256" y1="210" x2="256" y2="350" stroke="#b91c1c" stroke-width="4" stroke-linecap="round" />
    <!-- Seal character 阅 (Read) in Chinese Calligraphy style -->
    <text x="256" y="165" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="900" font-size="110" fill="#fef08a" text-anchor="middle" dominant-baseline="central">读</text>
  </g>
  <!-- Pinyin accent accentuating Chinese learning: 'dú' -->
  <text x="256" y="90" font-family="system-ui, sans-serif" font-weight="bold" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="4">dú · 汉字</text>
  <!-- App Subtitle -->
  <text x="256" y="415" font-family="system-ui, sans-serif" font-weight="700" font-size="28" fill="#fef08a" text-anchor="middle" letter-spacing="3">OFFLINE READER</text>
</svg>